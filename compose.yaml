services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bankdb"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db_net

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres,demo,demo-verification
      DB_URL: jdbc:postgresql://db:5432/bankdb
      DB_USER: bank
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BANK_ENCRYPTION_KEY: ${BANK_ENCRYPTION_KEY:?BANK_ENCRYPTION_KEY is required}
      BANK_LOOKUP_KEY: ${BANK_LOOKUP_KEY:?BANK_LOOKUP_KEY is required}
      BANK_DEMO_INBOX_KEY: ${BANK_DEMO_INBOX_KEY:?BANK_DEMO_INBOX_KEY is required}
      BANK_AUDIT_DIR: /app/logs
      SERVER_FORWARD_HEADERS_STRATEGY: native
    volumes:
      - backend-audit:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db_net
      - app_net

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND_ADDRESS:?FRONTEND_BIND_ADDRESS is required}:5500:80"
    volumes:
      - frontend-logs:/var/log/bank
    networks:
      - dmz_net
      - app_net

  log-collector:
    build: ./ops/logging
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 128m
    volumes:
      - backend-audit:/source/backend:ro
      - frontend-logs:/source/nginx:ro
      - collected-logs:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  backend-audit:
  frontend-logs:
  collected-logs:

networks:
  dmz_net:
    driver: bridge
  app_net:
    driver: bridge
    internal: true
  db_net:
    driver: bridge
    internal: true
