<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 · UCON Bank</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/pages/register.js"></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1 class="brand">UCON Bank</h1>
    <h2>회원가입</h2>
    <form id="register-form" novalidate>
      <p class="form-error" role="alert" hidden></p>
      <div class="field">
        <label for="username">아이디</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="32" required>
        <p class="field-hint">영문·숫자·밑줄(_) 3~32자</p>
        <p class="field-error" data-error-for="username"></p>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required>
        <p class="field-hint">12~64자 (UTF-8 기준 72바이트 이하)</p>
        <p class="field-error" data-error-for="password"></p>
      </div>
      <div class="field">
        <label for="passwordConfirm">비밀번호 확인</label>
        <input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required>
        <p class="field-error" data-error-for="passwordConfirm"></p>
      </div>
      <button type="submit" class="button primary block">가입하기</button>
    </form>
    <p class="auth-switch">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
  </main>
  <noscript>이 서비스는 JavaScript가 필요합니다.</noscript>
</body>
</html>
