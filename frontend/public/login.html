<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · Project Bank</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/pages/login.js"></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1 class="brand">Project Bank</h1>
    <h2>로그인</h2>
    <p class="notice success" id="registered-notice" hidden>회원가입이 완료되었습니다. 로그인해 주세요.</p>
    <form id="login-form" novalidate>
      <p class="form-error" role="alert" hidden></p>
      <div class="field">
        <label for="username">아이디</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
        <p class="field-error" data-error-for="username"></p>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="field-error" data-error-for="password"></p>
      </div>
      <button type="submit" class="button primary block">로그인</button>
    </form>
    <p class="auth-switch">계정이 없으신가요? <a href="register.html">회원가입</a></p>
  </main>
  <noscript>이 서비스는 JavaScript가 필요합니다.</noscript>
</body>
</html>
