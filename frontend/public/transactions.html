<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>거래내역 · Project Bank</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/pages/transactions.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="accounts.html">Project Bank</a>
    <nav>
      <a href="accounts.html">내 계좌</a>
      <a href="transfer.html">송금</a>
    </nav>
    <div class="user">
      <span data-username></span>
      <button type="button" class="button small" data-logout>로그아웃</button>
    </div>
  </header>

  <main class="container">
    <section class="panel" id="tx-section">
      <div class="panel-head">
        <div>
          <h1>거래내역</h1>
          <p class="account-heading">
            <span class="account-number" id="tx-account"></span>
            <span class="balance" id="tx-balance"></span>
          </p>
        </div>
        <div class="actions">
          <button type="button" class="button small" id="tx-refresh" hidden>새로고침</button>
          <a class="button small" id="tx-transfer" href="transfer.html" hidden>이 계좌에서 송금</a>
        </div>
      </div>
      <p class="form-error" role="alert" hidden></p>
      <p class="loading" id="tx-loading" hidden>거래내역을 불러오는 중…</p>
      <p class="empty-state" id="tx-empty" hidden>거래내역이 없습니다.</p>
      <div class="table-wrap">
        <table class="tx-table" id="tx-table" hidden>
          <thead>
            <tr><th scope="col">일시</th><th scope="col">구분</th><th scope="col">거래 상대</th><th scope="col" class="num">금액</th><th scope="col">거래 ID</th></tr>
          </thead>
          <tbody id="tx-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <noscript>이 서비스는 JavaScript가 필요합니다.</noscript>
</body>
</html>
