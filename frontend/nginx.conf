# Query strings, request bodies and authentication headers are intentionally excluded.
log_format bank_json escape=json
    '{"timestamp":"$time_iso8601","event":"http.access",'
    '"sourceIp":"$remote_addr","method":"$request_method","path":"$uri",'
    '"httpStatus":$status,"bytesSent":$body_bytes_sent,"durationSeconds":$request_time,'
    '"requestId":"$upstream_http_x_request_id","nginxRequestId":"$request_id"}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/bank/access.jsonl bank_json;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend backend:8080;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $backend backend:8080;
        proxy_pass http://$backend/health;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
