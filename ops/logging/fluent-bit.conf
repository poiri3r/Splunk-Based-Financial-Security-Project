[SERVICE]
    Flush                     1
    Grace                     10
    Log_Level                 info
    Parsers_File              /fluent-bit/etc/parsers.conf
    storage.path              /data/buffer
    storage.sync              full
    storage.checksum          on
    storage.max_chunks_up     16
    storage.backlog.mem_limit  8M

[INPUT]
    Name              tail
    Tag               bank.audit
    Path              /source/backend/audit*.log
    Parser            bank_json
    DB                /data/state/audit.db
    DB.Sync           Full
    Read_From_Head    On
    Refresh_Interval  2
    Rotate_Wait       10
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    Path_Key          sourceFile
    storage.type      filesystem
    storage.pause_on_chunks_overlimit On

[INPUT]
    Name              tail
    Tag               nginx.access
    Path              /source/nginx/access*.jsonl
    Parser            bank_json
    DB                /data/state/nginx.db
    DB.Sync           Full
    Read_From_Head    On
    Refresh_Interval  2
    Rotate_Wait       10
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    Path_Key          sourceFile
    storage.type      filesystem
    storage.pause_on_chunks_overlimit On

[FILTER]
    Name    modify
    Match   bank.audit
    Set     service backend
    Set     logType audit

[FILTER]
    Name    modify
    Match   nginx.access
    Set     service frontend
    Set     logType access

[OUTPUT]
    Name                     file
    Match                    bank.audit
    Path                     /data/collected
    File                     backend-audit.jsonl
    Format                   plain
    Rotate                   On
    Rotate_Max_Size          20M
    Rotate_Max_Files         5
    Rotate_Gzip              On
    Retry_Limit              no_limits
    storage.total_limit_size 256M

[OUTPUT]
    Name                     file
    Match                    nginx.access
    Path                     /data/collected
    File                     nginx-access.jsonl
    Format                   plain
    Rotate                   On
    Rotate_Max_Size          20M
    Rotate_Max_Files         5
    Rotate_Gzip              On
    Retry_Limit              no_limits
    storage.total_limit_size 256M
